name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        # OAuth verification uses the pinned JOSE dependency.
        run: npm ci
      - name: Run application and OAuth tests
        run: npm test
      - name: Build fresh Worker artifacts
        run: npm run build
      - name: Validate firm Worker module
        run: node --check apps/firm/dist/server/index.js
      - name: Validate vendor Worker module
        run: node --check apps/vendor/dist/server/index.js
